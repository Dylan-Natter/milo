name: Bug
description: Report incorrect behavior
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Deterministic checks proving the fix.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies and risks
  - type: input
    id: governing_spec
    attributes:
      label: Governing specification / issue
    validations:
      required: true
